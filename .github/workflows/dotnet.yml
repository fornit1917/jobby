# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master", "dev-v**" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            start_infra: true
            test_command: dotnet test --no-build --verbosity normal
          - os: windows-latest
            start_infra: false
            test_command: dotnet test tests/Jobby.Tests.Dashboard/Jobby.Tests.Dashboard.csproj --no-build --verbosity normal

    runs-on: ${{ matrix.os }}
    env:
      DOTNET_INSTALL_DIR: ${{ runner.temp }}/jobby-dotnet

    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x
        dotnet-quality: ga

    - name: Verify .NET 8 SDK
      shell: pwsh
      run: |
        $sdkVersion = dotnet --version
        Write-Output $sdkVersion
        if ($LASTEXITCODE -ne 0 -or $sdkVersion -notlike '8.0.*') {
          throw 'Expected the isolated .NET 8 SDK.'
        }

    - name: Install .NET WebAssembly build tools
      run: dotnet workload install wasm-tools

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Start infrastructure for integration tests
      if: ${{ matrix.start_infra }}
      uses: hoverkraft-tech/compose-action@11beaa1c2dae4e8ed7b1665aa074723b6cecb0e4 # v3.0.0
      with:
        compose-file: "docker-compose.postgresql.yml"      

    - name: Test
      run: ${{ matrix.test_command }}
